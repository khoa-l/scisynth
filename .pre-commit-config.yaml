repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9  # keep in sync with ruff in uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: numpydoc-lint
        name: numpydoc docstring validation
        entry: numpydoc lint
        language: python
        additional_dependencies: [numpydoc]
        files: ^src/.*\.py$
