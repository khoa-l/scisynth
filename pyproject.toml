[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[project]
name = "scisynth"
version = "0.1.0a1"
description = "Synthetic scientific data and synthetic observation pipelines."
readme = "README.md"
authors = [{ name = "khoa-l", email = "kly27@calpoly.edu" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
  "synthetic data",
  "simulation",
  "observation",
  "scientific visualization",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
polars = ["polars>=1.0"]
viz = ["plotly>=5.20"]
xarray = ["xarray>=2023.1"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
  "mypy>=1.13",
  "plotly>=5.20",
  "marimo>=0.10",
  "numpydoc>=1.11",
  "pdoc>=14",
  "pre-commit>=3",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "D", "F", "I", "B", "UP", "SIM", "RUF", "NPY"]
# Overrides (apply, sample, evaluate), properties and dunder methods inherit docs.
ignore = ["D102", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# The package lists in __init__.py are in reading order: the API docs follow them.
"src/scisynth/*/__init__.py" = ["RUF022"]
"tests/**" = ["D"]
"examples/**" = ["D", "B018"]  # B018: a marimo cell shows its last expression
"scripts/**" = ["D"]

[tool.mypy]
strict = true
files = [
  "src",
  "tests",
] # examples are marimo notebooks, whose cells are untyped

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "polars.*", "xarray.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"

[tool.coverage.run]
source = ["scisynth"]
branch = true

[tool.numpydoc_validation]
checks = [
  "all",
  "GL01",  # summary may start on the opening-quote line
  "ES01",  # extended summary not required
  "SA01",  # See Also not required
  "EX01",  # examples not required
  "SS06",  # summary may wrap lines
  "GL08",  # overrides and properties inherit their docs
  "PR02",  # the hook reads source, so it cannot see dataclass fields
]
# Private helpers, and stub modules (documented once they are implemented).
exclude = ['\._', '\.Warp$', '\.Regrid$']
exclude_files = [
  '^src/scisynth/(io|adapters)/',
  '^src/scisynth/latent/(catalogs|dataset|gridded|labels|timeseries)\.py$',
  '^src/scisynth/samplers/(binning|catalog|subset)\.py$',
  '^src/scisynth/stages/transforms/crop\.py$',
  '^src/scisynth/viz/latent\.py$',
]
