[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scisynth"
version = "0.1.0"
description = "Domain-agnostic synthetic scientific data generator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=2.5", "scipy>=1.18", "polars>=1.43"]

[project.optional-dependencies]
spatial = ["xarray>=2026.7", "networkx>=3.6"]
viz = ["ipywidgets>=8.1"]
dr = ["scikit-learn>=1.9", "zadu"]
all = ["scisynth[spatial,viz,dr]"]
dev = ["pytest>=9.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/scisynth"]
