[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scisynth"
version = "0.1.0"
description = "Domain-agnostic synthetic scientific data generator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "polars>=0.20"]

[project.optional-dependencies]
spatial = ["xarray>=2023.1", "networkx>=3.0"]
viz = ["ipywidgets>=8.0"]
dr = ["scikit-learn>=1.3", "zadu"]
all = ["scisynth[spatial,viz,dr]"]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/scisynth"]
