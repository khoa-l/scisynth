name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Setting it keeps `uv sync` and `uv run` on the same
      # interpreter. Otherwise `uv run` follows .python-version, which
      # can differ, and rebuilds the environment without the dev tools.
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --extra viz
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run numpydoc lint $(git ls-files 'src/*.py')
      - run: uv run pytest
